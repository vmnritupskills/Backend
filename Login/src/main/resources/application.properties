server.port=8080

# DATABASE (AWS RDS)
spring.datasource.url=jdbc:postgresql://database-2.cbis22o66mf8.ap-south-1.rds.amazonaws.com:5432/test_name
spring.datasource.username=postgres
spring.datasource.password=Elderstone123
spring.datasource.driver-class-name=org.postgresql.Driver

# HIKARI (Separate lines, NO inline comments)
# RDS terminates connections quickly, so refresh fast
spring.datasource.hikari.maxLifetime=60000
spring.datasource.hikari.idleTimeout=30000
spring.datasource.hikari.connectionTimeout=30000
spring.datasource.hikari.validationTimeout=5000
spring.datasource.hikari.maximumPoolSize=10

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# HIBERNATE
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# REDIS
spring.redis.host=redis
spring.redis.port=6379

# JWT
app.jwt.secret=G7h29dkL90sPqmZ19BxT4RwQfS8nK2LmV5yQ8zXe
app.jwt.access-exp-ms=3600000
app.jwt.refresh-exp-ms=604800000
app.security.password-cost=12

# ACTUATOR
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
