server.port=8082

# ============================
# DATABASE (AWS RDS - POSTGRES)
# ============================
spring.datasource.url=jdbc:postgresql://database-2.cbis22o66mf8.ap-south-1.rds.amazonaws.com:5432/test_name
spring.datasource.username=postgres
spring.datasource.password=Elderstone123
spring.datasource.driver-class-name=org.postgresql.Driver

# Required for Hibernate 7 when metadata fails
jakarta.persistence.jdbc.url=${spring.datasource.url}

# ============================
# HIKARI (RDS SAFE SETTINGS)
# ============================
spring.datasource.hikari.pool-name=HikariRDS
spring.datasource.hikari.maximumPoolSize=5
spring.datasource.hikari.minimumIdle=1

# RDS kills idle connections ? keep lifetime short
spring.datasource.hikari.maxLifetime=60000
spring.datasource.hikari.idleTimeout=30000
spring.datasource.hikari.connectionTimeout=30000
spring.datasource.hikari.validationTimeout=5000
spring.datasource.hikari.keepaliveTime=30000

# ============================
# FLYWAY (PRODUCTION SAFE)
# ============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# IMPORTANT:
# RDS already has empty schema ? baseline TRUE
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# ============================
# JPA / HIBERNATE
# ============================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# REQUIRED for Boot 4 + Hibernate 7
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================
# JWT
# ============================
app.jwt.secret=G7h29dkL90sPqmZ19BxT4RwQfS8nK2LmV5yQ8zXe
app.jwt.access-exp-ms=3600000
app.jwt.refresh-exp-ms=604800000
app.security.password-cost=12

# ============================
# ACTUATOR
# ============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
