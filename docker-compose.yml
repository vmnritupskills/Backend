version: "3.9"

services:
  backend:
    build: .
    container_name: lms_backend
    restart: always

    environment:
      # ======================
      # SERVER
      # ======================
      SERVER_PORT: ${SERVER_PORT}

      # ======================
      # DATABASE (AWS RDS)
      # ======================
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}

      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 5
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 1
      SPRING_DATASOURCE_HIKARI_MAX_LIFETIME: 60000
      SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT: 30000
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: 30000

      # ======================
      # JWT (RSA CONFIG)
      # ======================
      JWT_KEYSTORE_PATH: ${JWT_KEYSTORE_PATH}
      JWT_KEYSTORE_TYPE: ${JWT_KEYSTORE_TYPE}
      JWT_KEYSTORE_PASSWORD: ${JWT_KEYSTORE_PASSWORD}
      JWT_KEYSTORE_KEY_ALIAS: ${JWT_KEYSTORE_KEY_ALIAS}
      JWT_KEYSTORE_KEY_PASSWORD: ${JWT_KEYSTORE_KEY_PASSWORD}

      JWT_ACCESS_TOKEN_EXPIRY: ${JWT_ACCESS_TOKEN_EXPIRY}
      JWT_REFRESH_TOKEN_EXPIRY: ${JWT_REFRESH_TOKEN_EXPIRY}

      # ======================
      # AWS S3
      # ======================
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
