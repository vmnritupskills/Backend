server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  threads:
    virtual:
      enabled: true

# ===============================
# JWT (RSA)
# ===============================
jwt:
  keystore:
    path: ${JWT_KEYSTORE_PATH}
    type: ${JWT_KEYSTORE_TYPE}
    password: ${JWT_KEYSTORE_PASSWORD}
    key-alias: ${JWT_KEYSTORE_KEY_ALIAS}
    key-password: ${JWT_KEYSTORE_KEY_PASSWORD}

  access-token:
    expiry: ${JWT_ACCESS_TOKEN_EXPIRY}
  refresh-token:
    expiry: ${JWT_REFRESH_TOKEN_EXPIRY}

# ===============================
# AWS S3
# ===============================
aws:
  region: ${AWS_REGION}
  s3:
    bucket-name: ${AWS_S3_BUCKET}
  access-key-id: ${AWS_ACCESS_KEY_ID}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY}

# ===============================
# LOGGING
# ===============================
logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG

# ===============================
# ACTUATOR
# ===============================
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
